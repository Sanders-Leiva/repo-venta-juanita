<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pulpería Juanita | Admin Pro</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏪</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container-fluid h-100 p-0">
    <div class="row g-0 h-100">
        <nav class="col-12 col-md-3 col-lg-2 sidebar">
            <div class="sidebar-header p-4 d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <div class="logo-box me-2">PJ</div>
                    <h5 class="fw-bold m-0 text-white">Juanita App</h5>
                </div>
                <span class="badge bg-primary d-md-none">v1.2</span>
            </div>

            <div class="nav-container p-3 p-md-4">
                <div class="nav-group mb-4 d-none d-md-block">
                    <small class="text-white-50 fw-bold px-2 mb-3 d-block tracking-wider">MÓDULOS</small>
                    <div class="list-group list-group-flush border-0">
                        <a href="#" class="list-group-item active border-0 mb-2">🏷️ Catálogo Precios</a>
                        <a href="#" class="list-group-item disabled border-0 mb-2 opacity-50">📉 Ventas</a>
                    </div>
                </div>
                
                <div class="nav-group">
                    <small class="text-white-50 fw-bold px-2 mb-2 d-block tracking-wider">SISTEMA</small>
                    <p class="px-2 small text-white-50">Gestión de inventario activa.</p>
                </div>
            </div>
        </nav>

        <main class="col-12 col-md-9 col-lg-10 main-content">
            <div class="sticky-toolbar p-3 p-md-4">
                <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
                    <h2 class="fw-extrabold m-0 text-white fs-4 fs-md-2">Catálogo de Precios</h2>
                    <button class="btn btn-primary fw-bold shadow-sm btn-add-mobile" data-bs-toggle="collapse" data-bs-target="#panelAgregar">
                        + <span class="d-none d-md-inline">Agregar Producto</span>
                    </button>
                </header>

                <div class="toolbar-box p-2 p-md-3 row g-2">
                    <div class="col-12 col-md-8">
                        <input type="text" id="buscador" class="form-control toolbar-input" placeholder="🔍 Buscar nombre...">
                    </div>
                    <div class="col-12 col-md-4">
                        <select id="filtro-categoria-select" class="form-select toolbar-input" onchange="cambiarCategoria(this.value)">
                            <option value="TODOS">🌐 Todas</option>
                        </select>
                    </div>
                </div>
                <div id="contador-productos" class="mt-2 small text-white-50 fw-bold"></div>
            </div>

            <div class="p-3 p-md-4">
                <div class="collapse mb-4" id="panelAgregar">
                    <div class="card admin-card border-0">
                        <div class="card-body p-3 p-md-4">
                            <div class="row g-3 align-items-end">
                                <div class="col-12 col-md-4">
                                    <label class="form-label small fw-bold text-white-50">NOMBRE</label>
                                    <input type="text" id="nuevo-nombre" class="form-control" placeholder="Ej: Frijoles">
                                </div>
                                <div class="col-6 col-md-2">
                                    <label class="form-label small fw-bold text-white-50">PRECIO</label>
                                    <input type="number" id="nuevo-precio" class="form-control" placeholder="0">
                                </div>
                                <div class="col-6 col-md-3">
                                    <label class="form-label small fw-bold text-white-50">CATEGORÍA</label>
                                    <select id="nueva-categoria" class="form-select">
                                        <option value="VENTA">💰 Venta General</option>
                                        <option value="COCA COLA">🥤 Coca Cola</option>
                                        <option value="BIG COLA">🥤 Big Cola</option>
                                        <option value="LECHE">🥛 Leche</option>
                                        <option value="MEDICAMENTOS">💊 Medicamentos</option>
                                        <option value="VITRINA IZQ">🖼️ Vitrina Izq</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-3">
                                    <button class="btn btn-success w-100 fw-bold" onclick="guardarProducto()">Guardar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="grid-productos" class="row g-2 g-md-3"></div>
            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
        <div class="modal-content glass-modal text-white">
            <div class="modal-header border-0"><h5 class="fw-bold m-0">✏️ Editar</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body p-4">
                <input type="hidden" id="id-editar">
                <div class="mb-3"><label class="small fw-bold text-white-50 mb-1">NOMBRE</label><input type="text" id="nombre-editar" class="form-control"></div>
                <div class="mb-3"><label class="small fw-bold text-white-50 mb-1">PRECIO</label><input type="number" id="precio-editar" class="form-control"></div>
                <div class="mb-3"><label class="small fw-bold text-white-50 mb-1">CATEGORÍA</label>
                    <select id="categoria-editar" class="form-select">
                        <option value="VENTA">💰 Venta General</option>
                        <option value="COCA COLA">🥤 Coca Cola</option>
                        <option value="BIG COLA">🥤 Big Cola</option>
                        <option value="LECHE">🥛 Leche</option>
                        <option value="MEDICAMENTOS">💊 Medicamentos</option>
                        <option value="VITRINA IZQ">🖼️ Vitrina Izq</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer border-0"><button type="button" class="btn btn-success w-100 fw-bold" onclick="guardarCambios()">Guardar Cambios</button></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
