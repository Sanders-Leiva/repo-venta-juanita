<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulpería Juanita | Admin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏪</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container-fluid h-100">
    <div class="row h-100">
        <nav class="col-md-3 col-lg-2 sidebar-categories p-4">
            <h3 class="fw-bold mb-4 text-white">Categorías</h3>
            <div id="menu-categorias" class="list-group list-group-flush shadow-sm">
                <button class="list-group-item list-group-item-action active" onclick="filtrarPorCat('TODOS', this)">
                    🌐 Todos
                </button>
            </div>
        </nav>

        <main class="col-md-9 col-lg-10 p-4 main-content">
            <header class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold m-0 text-white">Pulpería Juanita</h1>
                    <p class="text-white-50 m-0">Administrador de Precios</p>
                </div>
                <div class="d-flex gap-2">
                    <input type="text" id="buscador" class="form-control search-input" placeholder="🔍 Buscar producto...">
                    <button class="btn btn-primary fw-bold" data-bs-toggle="collapse" data-bs-target="#panelAgregar">
                        + Nuevo
                    </button>
                </div>
            </header>

            <div class="collapse mb-4" id="panelAgregar">
                <div class="card admin-panel">
                    <div class="card-body p-4">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">NOMBRE</label>
                                <input type="text" id="nuevo-nombre" class="form-control">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label small fw-bold">PRECIO</label>
                                <input type="number" id="nuevo-precio" class="form-control">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold">CATEGORÍA</label>
                                <select id="nueva-categoria" class="form-select">
                                    <option value="VENTA">💰 Venta General</option>
                                    <option value="COCA COLA">🥤 Coca Cola</option>
                                    <option value="BIG COLA">🥤 Big Cola</option>
                                    <option value="LECHE">🥛 Leche</option>
                                    <option value="MEDICAMENTOS">💊 Medicamentos</option>
                                    <option value="VITRINA IZQ">🖼️ Vitrina Izq</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-success w-100 fw-bold" onclick="guardarProducto()">Guardar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="grid-productos" class="row g-3">
                </div>
        </main>
    </div>
</div>

<div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-modal text-white">
            <div class="modal-header border-0"><h5 class="modal-title">✏️ Editar</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="id-editar">
                <div class="mb-3"><label class="form-label small">NOMBRE</label><input type="text" id="nombre-editar" class="form-control"></div>
                <div class="mb-3"><label class="form-label small">PRECIO</label><input type="number" id="precio-editar" class="form-control"></div>
                <div class="mb-3"><label class="form-label small">CATEGORÍA</label>
                    <select id="categoria-editar" class="form-select">
                        <option value="VENTA">💰 Venta General</option>
                        <option value="COCA COLA">🥤 Coca Cola</option>
                        <option value="BIG COLA">🥤 Big Cola</option>
                        <option value="LECHE">🥛 Leche</option>
                        <option value="MEDICAMENTOS">💊 Medicamentos</option>
                        <option value="VITRINA IZQ">🖼️ Vitrina Izq</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-success fw-bold" onclick="guardarCambios()">Actualizar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
